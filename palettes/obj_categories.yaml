# OBJ palette assignment for Ultima: Runes of Virtue DX.
#
# Sprite slots (reverse_engineering/notes/sprites.md): slot b (0-15) holds
# tiles $80+b*8.. and its graphic id is stored at $C580+b by the loader at
# $28E1. Id bits: 7 = large sprite (continuation slots hold $FF),
# 6 = source (0: monsters, bank 6 $6AD9; 1: people, bank 1 $5A92),
# 1-5 = graphic index (128 bytes each), 0 = unused (cleared).
# OAM tiles below $80 are the player and use `player`.
# Keys are ids with bit 7 and bit 0 cleared (0x00-0x7E).
schema_version: 1
player: avatar
# Creatures (monsters, the Black Knight, wizards) are not listed here: each
# one has its natural colour in rov_palettes.yaml `creatures`, and the
# runtime fills OBJ palettes 1-6 per area with the creatures, folk, royal
# and item sprites that area loads (reverse_engineering/notes/monsters.md
# "Colours"). The categories below are classes of that allocation too:
# their colours are the obj_palettes entries of the same name.
# Graphics listed nowhere (people-bank $76-$7E: no template) use `default`.
default: folk
# The ship while sailing: tiles $B8-$BF in a slot the loader never filled
# (bank 0 $FF96 = $2B under the player). Brown hull; surface areas always
# reserve the folk palette for it.
ship: folk
# Verified in the Cavern of Hatred (areas 0x18/0x19): 0x40 imp, 0x46 hooded
# rogue. 0x40 and 0x5E only appear as talking NPCs (template damage byte
# >= $80 = talk id): folk.
ids:
  item:    [0x08, 0x12, 0x18, 0x30, 0x3A, 0x3E]   # wisp sparkle, chest, bomb, sign, thrown blades
  folk:    [0x40, 0x42, 0x44, 0x46, 0x4A, 0x4E, 0x54, 0x58, 0x5A, 0x5C, 0x5E, 0x60, 0x62, 0x6A, 0x6E, 0x70]  # 0x70 = jester (large)
  royal:   [0x48, 0x4C, 0x50, 0x56, 0x66, 0x68, 0x6C]   # Lord British, guards: one colour everywhere
