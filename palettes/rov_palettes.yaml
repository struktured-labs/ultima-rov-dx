      - name: melissa
        templates: [B46]
        colors: ["#FFFFFF", "#F6C5A4", "#CC4F7D", "#7F1B40"]
        why: "Melissa (talk $16): rose cloak and hood"
  townsman:     # $6A: generic townsman (A3E, B30) in folk colours
