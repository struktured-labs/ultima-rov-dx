# Natural creature colours (Carmelo, Oct 2026: "colors should naturally be
# assigned to creatures, but, if the game has harder versions of the same
# creature we can be more artistic to indicate such").
# One entry per creature type, identified by its sprite graphic(s) (`ids`:
# OBJPAL keys, id & $7E; large sprites list their continuation graphics too).
# The colour is the same in every area. `variants` exist only where the ROM
# has a tougher template of the same graphic (monsters.tiers: 1.4x damage and
# +4, or 4x HP); the builder checks that their number matches the ROM. Shades:
# 0 transparent (keep white), 1 light, 2 mid, 3 dark outline.
# Runtime (monsters.md "Colours"): when an area loads, OBJ palettes 1-6 are
# filled with the creatures in its sprite slots (folk / royal / item take one
# palette each when present), a tiered creature gets one palette per tier.
creatures:
  rat:          # $14 "Rats" (parade). Every dungeon.
    ids: [0x14]
    colors: ["#FFFFFF", "#E8D0B0", "#987050", "#302018"]
    why: brown sewer rat, pale belly
  bat:          # $0A. Every dungeon, also shops (cave bats).
    ids: [0x0A]
    colors: ["#FFFFFF", "#D8C0D0", "#705068", "#201020"]
    why: dusky violet-brown cave bat (mostly dark shades)
  slime:        # $0C "Slimes"
    ids: [0x0C]
    colors: ["#FFFFFF", "#B8F070", "#48A828", "#103010"]
    why: green ooze
    variants:
      - colors: ["#FFFFFF", "#FFB0A0", "#D83828", "#401008"]
        why: "B11 (48 HP, 16 damage, double the bite): red slime"
  gremlin:      # $0E "Gremlins" (they steal food in the Cavern of Cowardice)
