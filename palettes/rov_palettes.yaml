    wood:   { colors: ["#F8E0C0", "#D0A468", "#6E4C34", "#20140E"] }  # rocky ground, bones
    fire:   { colors: ["#E8B4AC", "#A88060", "#6E4C34", "#20140E"] }  # sky, top band (rose)
    gold:   { colors: ["#F0CAB4", "#B09CC8", "#6E4C34", "#20140E"] }  # sky, middle band + mountain tops

  menu:  # text screens, dialogs and the start menu: parchment boxes (shared
         # colour 0), item colours for the inventory icons
    ui:     { colors: ["#FFF8E8", "#C4BCB4", "#686050", "#181010"] }  # text, frames, letters (empty hearts/stars grey)
    gold:   { colors: ["#FFF8E8", "#F0C848", "#B87C18", "#5A3808"] }  # box frames, coins, keys, digits
    fire:   { colors: ["#FFF8E8", "#F88060", "#D02818", "#401008"] }  # hearts, red potions
    water:  { colors: ["#FFF8E8", "#88B8F0", "#3060C0", "#101C48"] }  # blue flask, magic
    stone:  { colors: ["#FFF8E8", "#B8C4D4", "#687890", "#182030"] }  # steel: blades, armour
    wood:   { colors: ["#FFF8E8", "#D8A868", "#8A5A2C", "#2A1808"] }  # bows, chests, boots, rope
    earth:  { colors: ["#FFF8E8", "#F0C0A0", "#A86848", "#301810"] }  # portrait skin, food, rock
    grass:  { colors: ["#FFF8E8", "#A0D070", "#408838", "#102010"] }  # green potion, rune of justice

  # scene themes (bg_tile_categories.yaml `scenes`)
  shrine:  # rune shrine: marble pillars, golden light from above, blue-violet steps, glowing rune
    stone:  { colors: ["#FFF8F0", "#C8C8E0", "#7878A8", "#282840"] }
    gold:   { colors: ["#FFF8F0", "#F8E8A8", "#D8B060", "#806030"] }
    water:  { colors: ["#FFF8F0", "#A8B0D8", "#585C98", "#1C1C38"] }
    fire:   { colors: ["#FFF8F0", "#F8C040", "#D04020", "#401008"] }
  royal:  # ending text: cream vellum, royal purple ink
    ui:     { colors: ["#FFF4D8", "#D8C0E0", "#7848A8", "#2C1048"] }
    gold:   { colors: ["#FFF4D8", "#F0C848", "#B87C18", "#5A3808"] }
  throne:  # ending throne room: warm stone, sky-blue windows, crimson banner with a gold ankh,
           # marble floor, gold throne and Lord British in red, carpeted steps
    stone:  { colors: ["#F4F0E8", "#C8C0B8", "#887C74", "#302824"] }
    water:  { colors: ["#F0F8FF", "#B0D0F0", "#6080B8", "#202848"] }
    fire:   { colors: ["#F8D860", "#E09030", "#902020", "#400818"] }
    earth:  { colors: ["#FFF8EC", "#E8D8C0", "#B09878", "#403020"] }
    gold:   { colors: ["#FFF8E8", "#F0C850", "#C03828", "#381010"] }
    wood:   { colors: ["#FFF8E8", "#D8B8A0", "#A04848", "#381818"] }
  death:  # skull and crossbones: bone on a blood-black night
    stone:  { colors: ["#F8F0E0", "#C8B8A0", "#806858", "#180810"] }
  credits:  # attract-loop credits: cream letters on a night-blue screen (inverted, like the title cards)
    ui:     { colors: ["#101828", "#38486C", "#8C9CC8", "#F8ECC8"] }
    gold:   { colors: ["#101828", "#6C5830", "#B08838", "#F8D070"] }
  scores:  # high-score tables: pale ledger paper, green ink, gold frame
    ui:     { colors: ["#F4F8EC", "#B8CCB0", "#4C7450", "#102818"] }
    gold:   { colors: ["#F4F8EC", "#E8C860", "#A07820", "#403008"] }
  parade:  # YOUR FRIENDS / YOUR FOES: pale sky paper, slate ink
    ui:     { colors: ["#EEF4FC", "#B4C4DC", "#5C6C90", "#141C34"] }

# OBJ palette 0 on scene screens (bg_tile_categories.yaml `scenes` obj).
# Dungeon title cards (bg_tile_categories.yaml scenes.title_card): UI palette
# per card number (HRAM $FF8F), in the colour of the virtue the dungeon's vice
# opposes; colour 0 = card, colour 3 = letters. Missing numbers keep the
# entrance theme's night-blue card (1, the Cavern of Hatred).
card_tints:
  2: { colors: ["#0C1838", "#3C5C98", "#7898D0", "#E0ECFF"] }  # Deceit: honesty blue
  3: { colors: ["#300808", "#783020", "#C06848", "#FFD8A8"] }  # Cowardice: valor red
  4: { colors: ["#08200C", "#2C5C34", "#6CA060", "#E0F8B8"] }  # Injustice: justice green
  5: { colors: ["#200C34", "#583880", "#9C78C8", "#F0E0FF"] }  # Dishonor: honor purple
  6: { colors: ["#301404", "#804018", "#C88038", "#FFE4A8"] }  # Selfishness: sacrifice orange
  7: { colors: ["#101010", "#484440", "#908C84", "#F4F0E4"] }  # Pride: humility grey
  9: { colors: ["#200410", "#601830", "#B04858", "#FFE0D0"] }  # the Great Stygian Abyss: ember red

scene_obj:
  stars:  ["#FFFFFF", "#FFF4C0", "#E8C860", "#806020"]   # death screen stars (drawn with OBP0 $1B)
  parade: ["#FFFFFF", "#F0D0A8", "#B06840", "#2C1810"]   # friends and foes (all OBJ palette 0 there)

# Start-menu cursor (sprite tiles 0-3, OBJ palette 7 while the menu is up;
# shade index through OBP0).
menu_cursor: ["#FFFFFF", "#F8E080", "#F09838", "#D83020"]

# The wand's fireball (sprite tiles $38-$47 on map screens, OBJ palette 7,
# shade index through OBP0): yellow core, orange flame, red edge.
wand_fire: ["#FFFFFF", "#FFE070", "#F88828", "#D82810"]

# Colours for a DMG palette whose four shades are alike (BGP/OBP $00 = blank
# white, $FF = black): every CGB palette gets the same colour, so blanking
# frames are uniform instead of showing each palette's colour 0.
flat_bg: ["#FFFFFF", "#B0B0B0", "#606060", "#000000"]
