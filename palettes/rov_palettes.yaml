# Ultima: Runes of Virtue DX palettes  (source of truth for colors)
#
# Colors are "#RRGGBB" (converted to BGR555, 5 bits per channel) or raw
# BGR555 hex like "7FFF". 4 per palette, index = DMG shade (0 = lightest,
# 3 = darkest). The runtime maps the game's BGP/OBP0/OBP1 values through
# these tables, so DMG fades/blanking keep working in color.
# Exactly 8 BG and 8 OBJ palettes, in hardware order. Names are referenced
# by palettes/bg_tile_categories.yaml and palettes/obj_categories.yaml.
# OBJ color 0 is transparent on hardware for colour index 0, but it is also
# the colour of DMG shade 0 when OBP0/OBP1 map a visible index to shade 0
# (e.g. OBP0=$34 in the dungeon-entrance cutscene), so keep it white.

bg_palettes:
  ui:     { colors: ["#FFF0C0", "#C4BAB4", "#D83020", "#281810"] }  # map side panel: parchment, grey (empty hearts/stars: not gold), red hearts, ink
  grass:  { colors: ["#D8F0A0", "#80C050", "#307828", "#102010"] }  # plains, trees, plants
  water:  { colors: ["#C8ECFF", "#5898E8", "#2050A8", "#082050"] }  # sea, rivers, fountains
  stone:  { colors: ["#E8E8E0", "#A8A8B8", "#585870", "#181820"] }  # dungeon floor/walls, castle
  wood:   { colors: ["#F8E0B0", "#C89050", "#785028", "#281808"] }  # doors, chests, furniture, ladders, ship
  earth:  { colors: ["#F0D8B0", "#C89868", "#885838", "#302010"] }  # brick, mountains, sand
  fire:   { colors: ["#E8E8E0", "#F8A020", "#C03010", "#401008"] }  # lava, fire, traps, floor items (color 0 = castle floor)
  gold:   { colors: ["#FFF0C0", "#E8C040", "#A06818", "#382008"] }  # shrines, ankh, carpets, logo

obj_palettes:
  avatar:  { colors: ["#FFFFFF", "#FFE0C0", "#3870D8", "#101830"] }  # the player (tiles < $80)
  creature_a: { colors: ["#FFFFFF", "#C8F088", "#48A030", "#102808"] }  # OBJ 1-3: power-on contents only; on map screens
  creature_b: { colors: ["#FFFFFF", "#FFC0A0", "#E03828", "#400C08"] }  # OBJ palettes 1-6 are refilled per area from
  creature_c: { colors: ["#FFFFFF", "#E8C8FF", "#9048D8", "#200838"] }  # `creatures` below (monsters.md "Colours")
  folk:    { colors: ["#FFFFFF", "#FFD8B0", "#C07840", "#402010"] }  # townsfolk, animals
  royal:   { colors: ["#FFFFFF", "#FFE0B0", "#D03838", "#302058"] }  # guards, Lord British
  item:    { colors: ["#FFFFFF", "#FFF8A0", "#E8B030", "#704010"] }  # chests, sparkles, missiles
  obp1:    { colors: ["#FFFFFF", "#E0E0E0", "#909090", "#202020"] }  # sprites using DMG OBP1

# The four champions, in the order of WRAM1 $D133 (0 Mariah, 1 Iolo, 2 Dupre,
# 3 Shamino; reverse_engineering/notes/heroes.md). `sprite` replaces OBJ
# palette 0 (avatar) once the game has started: walking, attack poses, the
# entrance-cutscene champion. Shades follow the DMG sprite: 0 transparent,
# 1 light (skin; Mariah's robe and hair, Dupre's armour), 2 mid (clothes,
# trim), 3 dark (outline; Shamino's cloak, Iolo's hair and beard).
# `portrait` colours that champion's portrait on the champion select (BG
# palettes 1-4 on that screen only; colour 0 = the parchment behind it).
heroes:
  - name: Mariah     # Mariah the Mage of Moonglow: violet robes, pale lilac light shade
    sprite:   ["#FFFFFF", "#F4E0F4", "#9048D0", "#281048"]
    portrait: ["#FFF8E8", "#F8D8C8", "#B87898", "#401860"]
  - name: Iolo       # Iolo the Bard of Britain: forest green, dark hair and beard
    sprite:   ["#FFFFFF", "#FFE0C0", "#48A848", "#20281C"]
    portrait: ["#FFF8E8", "#F0C8A0", "#A08050", "#1C4020"]
  - name: Dupre      # Dupre the swordsman of Jhelom, the only champion in armour: steel and red
    sprite:   ["#FFFFFF", "#E0E4F0", "#C83830", "#181828"]
    portrait: ["#FFF8E8", "#F0C0A0", "#B05C48", "#481414"]
  - name: Shamino    # Shamino the Ranger of Trinsic: dark green cloak, leather brown
    sprite:   ["#FFFFFF", "#FFE0C0", "#B07838", "#1C3018"]
    portrait: ["#FFF8E8", "#F0C8A0", "#A87048", "#382010"]

# Talk-dialog portraits (0:$1323, notes/menu.md "Talk dialog portraits"):
# every speaker's 4x4 portrait (tiles $D4-$E3) is drawn in BG palette
# `earth` of the UI theme (skin tones). Each entry gives one portrait the
# colours of the speaker's map sprite, so a character looks the same on the
# map and in its dialog. Key `portrait`: the portrait byte (first byte of the
# speaker's text record, game_layout.DIALOG_PORTRAITS). `npc`: a name from
# `npcs` (or one of its variants): its colours 1-3 become the portrait's
# shades 1-3 (1 skin / light, 2 hair and shading, 3 outline). `sprite`: a map
# graphic id (its creatures / obj_categories colours, same mapping). Or
# `colors` (4; colour 0 = the UI theme's paper, which is also the box around
# the face). Portrait bytes $02-$05 and $19 are used by no text record.
# Talk-dialog portrait palettes (dialog_portraits `colors` / `pals`): [paper, light, mid, line].
# Contrast rule: light / mid / line at the ecffaca portrait luminance (208 / 123 / 31, +-8%,
# line may be darker; tests/test_dx_patch.py). `bold` palettes colour a shade-1 fill (hat, robe)
# in a saturated hue that cannot be light: light ~100, line <= 34.
portrait_palettes:
  skin:            { colors: ["#FFF8E8", "#F0C0A0", "#A86848", "#301810"], why: "ecffaca earth: natural face (light skin, skin shadow, dark brown line)" }
  royal_skin:      { colors: ["#FFF8E8", "#F8CCA0", "#AC6F44", "#4A0C14"], why: "royal faces: skin, warm shading, dark royal-red line (v3)" }
  jester_red:      { colors: ["#FFF8E8", "#E83838", "#982028", "#400810"], bold: true, why: "Chuckles' right hat lobe and hair: map body red. BOLD: the lobe is a shade-1 fill, red at 208 would be pink" }
  jester_green:    { colors: ["#FFF8E8", "#98F09F", "#27B733", "#0A270C"], why: "Chuckles' left hat lobe: map trim green" }
  melissa_rose:    { colors: ["#FFF8E8", "#F9B8D0", "#DF477F", "#3E0F21"], why: "Melissa's hood: map rose" }
  penumbra_indigo: { colors: ["#FFF8E8", "#C4C7FA", "#686FD9", "#14184E"], why: "Penumbra's hair and robe: map indigo" }
  taynith_forest:  { colors: ["#FFF8E8", "#A1E8AF", "#31A848", "#0B2811"], why: "Taynith's hood and robe: map forest green" }
  ariana_gold:     { colors: ["#FFF8E8", "#F7CF63", "#A07B17", "#271F0A"], why: "Ariana's hair: map gold (colour 2)" }
  utomo_saffron:   { colors: ["#FFF8E8", "#FCC688", "#BF6D10", "#2F1C05"], why: "Utomo's topknot and shoulders: map saffron (only outline pixels there)" }
  zoltan_purple:   { colors: ["#FFF8E8", "#DFBDF3", "#A757D5", "#2D0F3E"], why: "Zoltan's bandana and its tail: map purple" }
  finn_blue:       { colors: ["#FFF8E8", "#B7D3F7", "#4588DE", "#0A203B"], why: "Finn's striped cap and collar: map sailor blue" }
  loubet_teal:     { colors: ["#FFF8E8", "#98E7ED", "#189FA9", "#06282A"], why: "Loubet's hair and coat: map teal" }
  johann_olive:    { colors: ["#FFF8E8", "#D0DD77", "#7F8E23", "#1C1F08"], why: "Johann's hair and collar: map olive" }
  royal_gold:      { colors: ["#FFF8E8", "#FBCF59", "#A87E0E", "#282007"], why: "crowns: gold" }
  royal_red:       { colors: ["#FFF8E8", "#D83838", "#902030", "#4A0C14"], bold: true, why: "royal robes: Lord British's map red (#D03838); line = royal_skin's, so outlines and beards run on across tile edges. BOLD like jester_red" }

dialog_portraits:
  # v5 (Carmelo: "make portraits better"): one 3-shade palette cannot hold a natural face
  # and a character colour at ecffaca contrast, so portraits colour single 8x8 tiles from up
  # to two more palettes (`tiles` / `pals`, DlgPortrait8 borrows two UI palettes the dialog
  # screen does not show): face tiles skin, hair / hat / hood / clothes tiles the NPC's map
  # hue. Royals: skin face, gold crown, red robe (Lord British's map sprite).
  lord_british:
    { portrait: 0x01, colors: royal_skin,
      tiles: ["YYYY", "....", "....", "R..R"], pals: { Y: royal_gold, R: royal_red }, why: "crown gold, shoulders royal red, face and beard skin" }
  gnu_gnu:
    { portrait: 0x00, colors: royal_skin,
      tiles: ["YYYY", "Y..Y", "....", "R..R"], pals: { Y: royal_gold, R: royal_red }, why: "crown (top row, sides) gold, shoulders royal red, face skin" }
  eep_eep:
    { portrait: 0x09, colors: royal_skin,
      tiles: ["....", "....", "....", "RRRR"], pals: { R: royal_red }, why: "collar royal red (whole bottom row: the band runs under the beard), face skin" }
  sign:                                            # signs (talk $01/$02): the map sign is an `item`
    portrait: 0x08                                 # sprite (pale yellow plaque); shade 1 fills the
    colors: ["#FFF8E8", "#E8D4A0", "#A47812", "#2F1B07"]   # whole picture, so a softer pale gold
  black_knight:     # portrait $15 (talk $1A): near-black helm like his sprite (creatures.black_knight),
    portrait: 0x15  # not its shade order: the helm's plates are portrait shade 1, so dark steel
    colors: ["#FFF8E8", "#343844", "#A0A8B8", "#040408"]   # plates, grey trim, black outline
  # named NPCs. Humans: `skin` face tiles, the map hue (`npcs`) on hair / hat / hood /
  # clothes tiles. Animals keep one palette from their map colours (`npc`, `line` = the map
  # body hue at portrait-line darkness). Contrast rule (Carmelo, v2 review: "wash out
  # contrast"): every portrait shade keeps the ecffaca luminance (light 208, mid 123, line 31,
  # +-8%, line may be darker; `bold` palettes excepted; tests/test_dx_patch.py).
  sherry:       { portrait: 0x06, npc: sherry, line: "#27180D" }
  beh_lem:      { portrait: 0x07, npc: beh_lem, line: "#10242F" }
  kador:        { portrait: 0x0A, npc: kador, line: "#1F1F1F" }
  chuckles:
    { portrait: 0x0B, colors: skin,
      tiles: ["GGRR", "G..R", "...R", "...."], pals: { G: jester_green, R: jester_red }, why: "jester hat: left lobe green, right lobe and hair red (map body); face skin" }
  klip:         { portrait: 0x0C, npc: klip_klop, line: "#2F180C" }
  klop:         { portrait: 0x0D, npc: klip_klop, line: "#2F180C" }
  dr_cat:       { portrait: 0x0E, npc: dr_cat, line: "#341704" }
  penumbra:
    { portrait: 0x0F, colors: skin,
      tiles: ["IIII", "I..I", "I...", "I..."], pals: { I: penumbra_indigo }, why: "hair and robe indigo, face skin" }
  johann:
    { portrait: 0x10, colors: skin,
      tiles: ["OOOO", "O..O", "O..O", "OOOO"], pals: { O: johann_olive }, why: "hair and collar olive, face skin" }
  loubet:
    { portrait: 0x11, colors: skin,
      tiles: ["TTTT", "T..T", "T...", "TTTT"], pals: { T: loubet_teal }, why: "hair and coat teal, face skin" }
  zoltan:
    { portrait: 0x12, colors: skin,
      tiles: ["PPPP", "...P", "...P", "...."], pals: { P: zoltan_purple }, why: "bandana and its knot purple, face and beard skin" }
  finn:
    { portrait: 0x13, colors: skin,
      tiles: ["BBBB", "....", "....", "B..B"], pals: { B: finn_blue }, why: "cap and collar blue, face and hair skin" }
  ariana:
    { portrait: 0x14, colors: skin,
      tiles: ["GGGG", "G..G", "G..G", "G..G"], pals: { G: ariana_gold }, why: "hair gold all round, face skin" }
  melissa:
    { portrait: 0x16, colors: skin,
      tiles: ["RRRR", "R..R", "R..R", "R..R"], pals: { R: melissa_rose }, why: "hood rose all round, face skin" }
  utomo:
    { portrait: 0x17, colors: skin,
      tiles: ["SSSS", "....", "....", "S..S"], pals: { S: utomo_saffron }, why: "topknot and shoulders saffron (outline only: no fill pixels), face skin" }
  taynith:
    { portrait: 0x18, colors: skin,
      tiles: ["FFFF", "F..F", "F..F", "FFFF"], pals: { F: taynith_forest }, why: "hood and robe forest green, face skin" }

# Per-area-theme BG color overrides (theme names come from
# palettes/bg_tile_categories.yaml `area_themes`). Palettes not listed keep
# the colors above. The runtime swaps the whole BG set when the player
# enters an area of a different theme (see colorization_design.md).
bg_themes:
  cavern:   # dungeons: every palette shares the dusty cave-floor color 0 so
            # furniture, doors and hazards sit on the floor instead of boxes
    ui:     { colors: ["#C8BCA0", "#8E8884", "#C82818", "#201410"] }  # side panel on the cave floor (empty hearts/stars grey)
    stone:  { colors: ["#C8BCA0", "#8C90A0", "#4C5068", "#141420"] }  # cave floor + cobbled rock
    wood:   { colors: ["#C8BCA0", "#C08848", "#704820", "#241408"] }  # doors, chests, barrels, furniture, ladders
    earth:  { colors: ["#C8BCA0", "#A08060", "#604028", "#201408"] }  # rubble, pebbles
    grass:  { colors: ["#C8BCA0", "#88B858", "#3C7030", "#102010"] }  # mushrooms, plants
    water:  { colors: ["#C8BCA0", "#58A0E8", "#2050A8", "#082050"] }  # fountains, pools
    fire:   { colors: ["#C8BCA0", "#F89828", "#C02810", "#400808"] }  # lava, fire traps
    gold:   { colors: ["#C8BCA0", "#E8C040", "#A06818", "#382008"] }  # arrow floors, switches
  deceit:  # The Cavern of Deceit: illusion and treachery, misty sea-green rock, magenta traps
