# OBJ palette 0 on scene screens (bg_tile_categories.yaml `scenes` obj).
# Dungeon title cards (bg_tile_categories.yaml scenes.title_card): UI palette
# per card number (HRAM $FF8F), in the colour of the virtue the dungeon's vice
# opposes; colour 0 = card, colour 3 = letters. Missing numbers keep the
# entrance theme's night-blue card (1, the Cavern of Hatred).
card_tints:
  2: { colors: ["#0C1838", "#3C5C98", "#7898D0", "#E0ECFF"] }  # Deceit: honesty blue
  3: { colors: ["#300808", "#783020", "#C06848", "#FFD8A8"] }  # Cowardice: valor red
  4: { colors: ["#08200C", "#2C5C34", "#6CA060", "#E0F8B8"] }  # Injustice: justice green
  5: { colors: ["#200C34", "#583880", "#9C78C8", "#F0E0FF"] }  # Dishonor: honor purple
  6: { colors: ["#301404", "#804018", "#C88038", "#FFE4A8"] }  # Selfishness: sacrifice orange
  7: { colors: ["#101010", "#484440", "#908C84", "#F4F0E4"] }  # Pride: humility grey
  9: { colors: ["#200410", "#601830", "#B04858", "#FFE0D0"] }  # the Great Stygian Abyss: ember red

scene_obj:
  stars:  ["#FFFFFF", "#FFF4C0", "#E8C860", "#806020"]   # death screen stars (drawn with OBP0 $1B)
  parade: ["#FFFFFF", "#F0D0A8", "#B06840", "#2C1810"]   # friends and foes (all OBJ palette 0 there)

# Start-menu cursor (sprite tiles 0-3, OBJ palette 7 while the menu is up;
# shade index through OBP0).
menu_cursor: ["#FFFFFF", "#F8E080", "#F09838", "#D83020"]

# The wand's fireball (sprite tiles $38-$47 on map screens, OBJ palette 7,
# shade index through OBP0): yellow core, orange flame, red edge.
wand_fire: ["#FFFFFF", "#FFE070", "#F88828", "#D82810"]

# Colours for a DMG palette whose four shades are alike (BGP/OBP $00 = blank
# white, $FF = black): every CGB palette gets the same colour, so blanking
# frames are uniform instead of showing each palette's colour 0.
flat_bg: ["#FFFFFF", "#B0B0B0", "#606060", "#000000"]

# Named NPCs (Carmelo, 2026-10-11): each talking character has its own natural
# colour on the map, allocated per area like the creatures (OBJ palettes 1-6,
# creatures.py), and its dialog portrait the same hues (`dialog_portraits` npc:).
# Shades as on the map sprite: 1 light (skin, highlights, the shadow under the
# feet), 2 mid (hood, hair, trim), 3 the body AND outline (the colour you see on
# the map: saturated, luminance ~50-80). Hues spread round the wheel so NPCs that
# share a sprite or a room differ (v4).
# NPCs are allocated after the creatures; when a room wants more than 6
# palettes the NPCs that do not fit wear the shared `folk` colours.
# Graphics shared by several NPCs ($46, $6A): `colors` = the generic sprite
# (folk colours), `variants` = the named NPCs by template (tiers 1-3).
# Talk ids / templates: reverse_engineering/notes/menu.md "Talk dialog portraits".
npcs:
  sherry:       # $40, B34/B36 (talk $04/$06): Sherry the mouse
    ids: [0x40]
    colors: ["#FFFFFF", "#E8C4B7", "#907360", "#45382E"]
    why: brown-grey mouse fur, pink-white belly
  kador:        # $4E, B37 (talk $07)
    ids: [0x4E]
    colors: ["#FFFFFF", "#E0DCD4", "#7F7973", "#373737"]
    why: white dog with a grey outline
  utomo:        # $54, B42 (talk $12)
    ids: [0x54]
    colors: ["#FFFFFF", "#F6C5A4", "#B06B47", "#804807"]
    why: "saffron monk's robe; skin and its shadow stay natural (they are his face)"
  finn:         # $58, B45 (talk $15)
    ids: [0x58]
    colors: ["#FFFFFF", "#F6C5A4", "#A7705A", "#12427F"]
    why: sailor blue
  ariana:       # $5A, B3C (talk $0C)
    ids: [0x5A]
    colors: ["#FFFFFF", "#F6C5A4", "#9F7F17", "#6D2066"]
    why: blonde girl (gold hair = colour 2) in a plum dress
  dr_cat:       # $5C, B3E (talk $0E)
    ids: [0x5C]
    colors: ["#FFFFFF", "#FFD898", "#CB6810", "#6F3209"]
    why: orange tabby cat
  beh_lem:      # $5E, B38 (talk $08)
    ids: [0x5E]
    colors: ["#FFFFFF", "#DCCAB7", "#867769", "#2D383D"]
    why: "warm stone-grey gargoyle (slate blue made the portrait face look ghostly)"
  klip_klop:    # $60 front / $62 back half, B39/B3A (talk $09/$0A): one horse, two talkers
    ids: [0x60, 0x62]
    colors: ["#FFFFFF", "#F5C883", "#B86E2E", "#5F2F18"]
    why: chestnut horse; Klip and Klop are the two halves of one horse, so one colour
  chuckles:     # $70 (large $F0), B2B/B33/B3B (talk $03/$0B/$1C): the jester
    ids: [0x70]
    colors: ["#FFFFFF", "#F6C5A4", "#27B733", "#981627"]
    why: jester motley, red with green trim (red is the body colour so it shows on the map)
  hooded:       # $46: generic hooded figure (A23, A3F) in folk colours
    ids: [0x46]
    colors: ["#FFFFFF", "#FFD8B0", "#C07840", "#402010"]
    why: unnamed townsfolk keep the shared folk brown
    variants:
      - name: penumbra
        templates: [B3F]
        colors: ["#FFFFFF", "#F6C5A4", "#6870D3", "#222A9F"]
