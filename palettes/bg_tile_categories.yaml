# BG attribute assignment for Ultima: Runes of Virtue DX.
#
# How BG tiles are organised (see reverse_engineering/notes/bg_tiles.md):
#   * Tiles $00-$3F are 16 "metatile slots": slot s = tiles s*4..s*4+3
#     (VRAM $9000+s*64). The slot loader (bank1:$4ECD-$4F7C) copies a
#     2x2 graphic from bank 1 at $689B + g*64 into the slot, where
#     g = 0..63 is the town/dungeon set and g = 64..92 the overworld set
#     (base $789B). The runtime records the palette of graphic g for the
#     slot, so every tile of the slot gets metatile_palettes[g].
#   * Tiles $40-$FF are font/UI (status bar, text boxes, menus).
#
# Values are palette names from palettes/rov_palettes.yaml (bg_palettes).
schema_version: 2

default_metatile_palette: stone
metatile_palettes:
  # --- town / dungeon set (atlas A, g = $00-$3F) ---
  stone: [0x00, 0x01, 0x02, 0x05, 0x07, 0x0D, 0x16, 0x1D, 0x1F, 0x20, 0x21, 0x23,
          0x29, 0x2B, 0x2C, 0x31, 0x33, 0x35, 0x36, 0x38, 0x39, 0x3A, 0x3B, 0x3D,
          0x41, 0x50, 0x52]                             # floors, rock, pits, levers, pillars, grates, castle floor
  wood:  [0x03, 0x04, 0x06, 0x09, 0x0C, 0x0E, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15,
          0x17, 0x18, 0x19, 0x1A, 0x2A, 0x2D, 0x2E,
          0x49, 0x4C, 0x54, 0x55]                       # doors, ladders, chests, furniture, ship, houses
  earth: [0x08, 0x1E, 0x40, 0x44, 0x4A, 0x4B, 0x4D]   # brick walls, mountains, hills
  water: [0x0B, 0x0F, 0x45, 0x46, 0x47, 0x48]           # water, fountain
  grass: [0x0A, 0x1B, 0x1C, 0x30, 0x32, 0x34, 0x42, 0x43, 0x4E, 0x4F]  # plains (dotted), plants, trees
  fire:  [0x24, 0x2F, 0x3C]                             # lava/swamp blotches, spike trap, brazier
  gold:  [0x22, 0x25, 0x26, 0x27, 0x28, 0x37, 0x3E, 0x3F, 0x51, 0x53]  # shop sign, arrows, carpets, shrine, ankh

# Palette for font/UI tiles $40-$FF on game screens (overrides allowed).
ui_palette: ui
# Tiles $40-$4F hold the floor-item graphics of the current area (heart
# pickups etc., drawn as BG tiles on the map; verified in the Cavern of
# Hatred). They use `fire` so hearts read red and color 0 matches the floor.
ui_overrides: {0x40: fire, 0x41: fire, 0x42: fire, 0x43: fire, 0x44: fire, 0x45: fire, 0x46: fire, 0x47: fire,
               0x48: fire, 0x49: fire, 0x4A: fire, 0x4B: fire, 0x4C: fire, 0x4D: fire, 0x4E: fire, 0x4F: fire,
               # side panel (window): $E4 full star and the coin $F5/$F7 in gold; hearts $F4,
               # empty heart $E5, empty star $E7, letters and digits stay on the ui palette,
               # which the map themes make the panel palette (parchment, pale, red, dark).
               # $F8-$FB / $FC-$FF (A / B item icons) follow item_palettes at run time.
               # letters A/B ($F2/$F3) have shade-2 antialiasing: gold, not the red ink.
               0xE4: gold, 0xF2: gold, 0xF3: gold, 0xF5: gold, 0xF7: gold}

# Title-screen LUTs, used on screens whose LCD-on site is `rst $30`
# (game_layout.TITLE_LCD_ON_SITES). The runtime picks the LUT from LCDC
# bit 3 of the value being written: 0 (map $9800) = castle, 1 ($9C00) = logo.
title_screens:
  castle:            # picture uses tile ids in reading order
    default: stone   # $00-$65 sky and castle
    ranges:
      - { first: 0x66, last: 0xC1, palette: grass }   # hills and road
  logo:
    default: stone   # white/gray gradient background rows
    ranges:
      - { first: 0x01, last: 0x3B, palette: fire }    # "Ultima" lettering
      - { first: 0x3C, last: 0x3D, palette: gold }    # coin (ankh medallion)
      - { first: 0x3F, last: 0x42, palette: gold }
      - { first: 0x44, last: 0x4A, palette: gold }
      - { first: 0x4C, last: 0x52, palette: gold }
      - { first: 0x54, last: 0x5A, palette: gold }
      - { first: 0x5C, last: 0x62, palette: gold }
      - { first: 0x64, last: 0x68, palette: gold }
      - { first: 0x6A, last: 0x6C, palette: gold }
      - { first: 0x6D, last: 0x9B, palette: water }   # "Runes of Virtue" band

# Per-area themes, selected by the area id at $D12F when metatile slots are
# loaded (reverse_engineering/notes/dungeons.md). Each theme may override
# metatile_palettes entries; its colors come from rov_palettes.yaml
# bg_themes.<name>. Areas not listed use theme 0 (the tables above).
# At most 3 themes (MAX_THEMES = 4 including theme 0).
area_themes:
  cavern:
    areas: [0x18, 0x19, 0x1A]    # Cavern of Hatred: 0x18 entrance, 0x19 second level, 0x1A third (shrine rooms)
    metatile_palettes:
      earth: [0x23]              # pebbles / rubble
  entrance:
    areas: []                    # no map area: selected by the entrance LCD-on sites
  menu:
    areas: []                    # no map area: text screens, dialogs and the start menu

# Theme used by dungeon title cards (bank 7 $4619) and the entrance cutscene
# (bank 7 $4692); the area theme returns when the next area loads.
# Areas drawn from the surface/overworld atlas (bank 1 $7E8B list, plus
# $7E95 `03 4C` and $7E98 `45 46` used under the $C511/$D13E flags, see the
# slot loader at bank 1 $4F26). Every other area id is a dungeon level and gets
# dungeon_theme unless an area_themes entry lists it (the eight dungeons,
# Zoltan's and the Lycaeum basement: all drawn from the dungeon atlas).
surface_areas: [0x00, 0x02, 0x03, 0x04, 0x05, 0x32, 0x33, 0x45, 0x46, 0x4C, 0x4E, 0x51]
dungeon_theme: cavern

entrance_theme: entrance
# Theme of text screens, in-play dialogs and the start menu. Its palettes all
# share the parchment colour 0 so item icons sit on the menu boxes.
ui_theme: menu

# Text screens (story, dialogs, champion select, title cards): every tile uses
# the UI palette except these (same colours as the start menu). Tile ids from
# the map dumps of the champion select and Lord British's dialog (tmp/probe).
text_screen:
  ranges:
    - { first: 0x02, last: 0x0B, palette: gold }   # box frames: gold-brown lines
    - { first: 0xD4, last: 0xE3, palette: earth }  # speaker portrait (skin tones)
# Champion select only (mode byte $7F): the four portraits.
champion_screen:
  ranges:
    - { first: 0x10, last: 0x3F, palette: earth }  # Mariah, Iolo, Dupre
    - { first: 0x80, last: 0x8F, palette: earth }  # Shamino

# Start menu LUT (bank 0 $10A8, notes/menu.md). Tiles $0C-$8B (item grid),
# $BC-$BF (armour) and $F8-$FF (A/B icons) are overwritten at run time from
# item_palettes; dialogs reuse entries $E4-$FF (side panel, digits).
menu_screen:
  default: ui
  ranges:
    - { first: 0x02, last: 0x0B, palette: gold }   # box frames: gold-brown lines
    - { first: 0xD4, last: 0xE3, palette: earth }  # champion portrait (skin tones)
    - { first: 0xE4, last: 0xE4, palette: gold }   # full star
    - { first: 0xE8, last: 0xF1, palette: gold }   # digits 0-9 (stats, gold count)
    - { first: 0xF4, last: 0xF4, palette: fire }   # full heart
    - { first: 0xF5, last: 0xF5, palette: gold }   # coin
    - { first: 0xF7, last: 0xF7, palette: gold }

# BG palette per item id (icon = bank 3 $4B00 + id*64; tmp atlas in
# notes/menu.md). Used by the start-menu grid, the armour slot and the side
# panel A/B icons in every theme (map themes: same palette names).
item_palettes:
  stone: [0x00, 0x04, 0x08, 0x0A, 0x0B, 0x0F, 0x12, 0x15, 0x18, 0x19, 0x1A, 0x1B, 0x1C,
          0x20, 0x29, 0x33, 0x34]                     # armour, blades, throwing stars, pick, chain, caltrops
  wood:  [0x01, 0x02, 0x03, 0x05, 0x11, 0x21, 0x2C, 0x2D, 0x2E, 0x30, 0x37]   # bows, arrows, boomerang, whip, chest, rope, boots, net, pipes
  water: [0x06, 0x07, 0x16, 0x24]                     # blue flask, magic staff, rain, rune of honesty (hand)
  gold:  [0x09, 0x0C, 0x14, 0x17, 0x1D, 0x1E, 0x1F, 0x25, 0x2A, 0x31, 0x32, 0x36, 0x38, 0x3E]  # coins, keys, lamp, rings, chalice, ankh, compass, stars
  fire:  [0x0D, 0x10, 0x23, 0x26, 0x28, 0x3F]         # fireballs, heart, red potion, runes of valour / sacrifice
  earth: [0x0E, 0x13, 0x22, 0x2F, 0x35]               # rock, food
  grass: [0x27, 0x3D]                                 # rune of justice, green potion

# Tile -> palette LUT for the dungeon-entrance cutscene (one picture shared by
# all dungeon entrances; tiles are numbered in reading order). Derived by
# majority vote over screen regions (tmp probe, see notes/cutscene.md).
pictures:
  entrance:
    # The picture's DMG colour indices are almost disjoint by material: sky
    # is colour 0, the mountains / misty plain / ground use colour 1, the
    # cliff and rocks colours 2-3. rov_palettes.yaml bg_themes.entrance gives
    # every picture palette the same colours 0, 2 and 3, so the palette of a
    # tile only chooses what colour 1 means there (violet mountain, green
    # plain, ochre ground) and tiles on a boundary show no seams. Tiles with
    # colour 1 are classed by the row of their first use (rows 0-4 mountains,
    # 5-10 plain, 11+ ground); tiles without it by default (cliff).
    default: earth
    ranges:
      - { first: 0x04, last: 0x04, palette: fire }    # cliff edge against the top sky band
      - { first: 0x05, last: 0x05, palette: water }   # sky (lowest band; upper bands by fixups)
      - { first: 0x0A, last: 0x0B, palette: fire }
      - { first: 0x10, last: 0x10, palette: gold }    # cliff edge against the middle band
      - { first: 0x11, last: 0x13, palette: gold }    # mountain tops in the middle band
      - { first: 0x17, last: 0x17, palette: gold }
      - { first: 0x18, last: 0x20, palette: gold }
      - { first: 0x21, last: 0x26, palette: earth }
      - { first: 0x27, last: 0x33, palette: stone }
      - { first: 0x34, last: 0x38, palette: earth }
      - { first: 0x39, last: 0x41, palette: grass }
      - { first: 0x42, last: 0x47, palette: earth }
      - { first: 0x48, last: 0x4B, palette: grass }
      - { first: 0x4C, last: 0x51, palette: earth }
      - { first: 0x52, last: 0x55, palette: grass }
      - { first: 0x56, last: 0x5A, palette: earth }
      - { first: 0x5B, last: 0x5D, palette: grass }
      - { first: 0x5E, last: 0x62, palette: earth }
      - { first: 0x63, last: 0x64, palette: grass }
      - { first: 0x65, last: 0x6F, palette: earth }
      - { first: 0x70, last: 0xE3, palette: wood }
    # Per-cell attributes for tiles used in two places: tile $1E (solid colour
    # 1) is a mountain top at row 3 and the ground's right edge; the sky tile
    # $05 gets banded dusk colours (fire = top band rows 0-1, gold = middle
    # band rows 2-3; bg_themes.entrance gives those palettes the sky shades).
    fixups:
      - { row: 13, col: 19, palette: wood }
      - { row: 0, col: 5, palette: fire }
      - { row: 0, col: 6, palette: fire }
      - { row: 0, col: 7, palette: fire }
      - { row: 0, col: 8, palette: fire }
      - { row: 0, col: 9, palette: fire }
      - { row: 0, col: 10, palette: fire }
      - { row: 0, col: 11, palette: fire }
      - { row: 0, col: 12, palette: fire }
      - { row: 0, col: 13, palette: fire }
      - { row: 0, col: 14, palette: fire }
      - { row: 0, col: 15, palette: fire }
      - { row: 0, col: 16, palette: fire }
      - { row: 0, col: 17, palette: fire }
      - { row: 0, col: 18, palette: fire }
      - { row: 0, col: 19, palette: fire }
      - { row: 1, col: 6, palette: fire }
      - { row: 1, col: 7, palette: fire }
      - { row: 1, col: 8, palette: fire }
      - { row: 1, col: 9, palette: fire }
      - { row: 1, col: 10, palette: fire }
      - { row: 1, col: 11, palette: fire }
      - { row: 1, col: 12, palette: fire }
      - { row: 1, col: 13, palette: fire }
      - { row: 1, col: 14, palette: fire }
      - { row: 1, col: 15, palette: fire }
      - { row: 1, col: 16, palette: fire }
      - { row: 1, col: 17, palette: fire }
      - { row: 1, col: 18, palette: fire }
      - { row: 1, col: 19, palette: fire }
      - { row: 2, col: 6, palette: gold }
      - { row: 2, col: 7, palette: gold }
      - { row: 2, col: 8, palette: gold }
      - { row: 2, col: 9, palette: gold }
      - { row: 2, col: 10, palette: gold }
      - { row: 2, col: 11, palette: gold }
      - { row: 2, col: 12, palette: gold }
      - { row: 2, col: 13, palette: gold }
      - { row: 2, col: 17, palette: gold }
      - { row: 2, col: 18, palette: gold }
      - { row: 2, col: 19, palette: gold }
      - { row: 3, col: 6, palette: gold }
      - { row: 3, col: 7, palette: gold }
      - { row: 3, col: 18, palette: gold }
      - { row: 3, col: 19, palette: gold }
